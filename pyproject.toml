[project]
name = "deep-fusion"
version = "0.1.0"
description = "Deep Fusion - China Financial Analysis MCP Server"
readme = "README.md"
requires-python = ">=3.14"
keywords = ["fintech", "akshare", "stock", "mcp", "deep-fusion"]
license = { text = "MIT" }
dependencies = [
    "fastmcp==3.4.2",
    "akshare==1.18.64",
    "cachetools==7.1.4",
    "diskcache>=5.6.0",
    "pandas>=3.0.2",
    "starlette>=0.46.0",
    "requests>=2.32.0",
    "pytest-asyncio>=1.3.0",
    "python-dotenv>=1.0.0",
    "psycopg2-binary>=2.9.12",
    "fastapi>=0.136.3",
    "uvicorn>=0.46.0",
    "pydantic>=2.13.3",
    "numpy>=1.26.0",
    "scipy>=1.15.0",
    "matplotlib>=3.10.0",
    "pysocks>=1.7.1",
    "pandas-stubs~=3.0.2",
    "networkx>=3.2",
    "statsmodels>=0.14",
    "arch>=7.0",
    "aiofile==3.11.1",
    "authlib==1.7.2",
    "cyclopts==4.18.0",
    "mcp==1.27.2",
    "scipy-stubs~=1.17.1",
]

[project.scripts]
deep-fusion = "deep_fusion:main"

[tool.ruff]
line-length = 120
target-version = "py314"
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=9.0.2", "pytest-asyncio>=1.3.0", "python-dotenv>=1.0.0", "pytest-cov>=7.0.0"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["deep_fusion"]

[tool.uv]
system-certs = true
