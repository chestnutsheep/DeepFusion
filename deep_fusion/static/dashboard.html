<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>宏观·中观·微观·政策·国际 | 时间穿梭工作台</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <style>
        :root {
            --bg-deep: #1A2F2A; --bg-panel: rgba(43,74,74,0.35); --bg-panel-hover: rgba(43,74,74,0.55);
            --bg-sidebar: rgba(20,30,30,0.98); --bg-sidebar-gradient: linear-gradient(180deg, rgba(20,30,30,0.97), rgba(35,50,50,0.95));
            --bg-body-gradient: linear-gradient(180deg, rgba(26,47,42,0.92), rgba(26,47,42,0.75), rgba(26,47,42,0.4));
            --border-subtle: rgba(212,168,83,0.12); --border-hover: rgba(212,168,83,0.25);
            --text-primary: #E8E0D0; --text-secondary: #B0A898; --text-muted: #7A7266;
            --accent-gold: #D4A853; --accent-rose: #C49BA5; --accent-purple: #7B5E7B;
            --accent-green: #3E6B5C; --accent-red: #C47B7B;
            --radius-sm: 8px; --radius: 12px; --radius-lg: 18px;
            --font-sans: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', 'Inter', 'Helvetica Neue', sans-serif;
            --font-mono: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', monospace;
            --nav-width: 270px; --transition: 0.25s ease;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:var(--font-sans); background:var(--bg-body-gradient); color:var(--text-primary); line-height:1.5; min-height:100vh; font-size:14px; }
        ::-webkit-scrollbar { width:6px; } ::-webkit-scrollbar-track { background:transparent; } ::-webkit-scrollbar-thumb { background:var(--accent-purple); border-radius:8px; }
        .sb { position:fixed; left:0; top:0; bottom:0; width:var(--nav-width); background:var(--bg-sidebar-gradient); backdrop-filter:blur(18px); border-right:1px solid var(--border-subtle); padding:28px 0 20px; z-index:100; overflow-y:auto; }
        .sb-b { padding:0 20px 24px; border-bottom:1px solid var(--border-subtle); margin-bottom:16px; }
        .sb-b h1 { font-size:18px; font-weight:800; color:var(--accent-gold); letter-spacing:1px; }
        .sb-b p { font-size:11px; color:var(--text-muted); margin-top:6px; }
        .mn { margin-left:var(--nav-width); position:relative; z-index:2; padding:0 0 20px 0; }
        #top-tabs { display:flex; background:rgba(13,17,23,0.65); backdrop-filter:blur(12px); border-bottom:1px solid var(--border-subtle); padding:0 28px; gap:6px; overflow-x:auto; }
        .tab-btn { background:transparent; border:none; color:var(--text-secondary); padding:12px 26px; font-size:14px; font-weight:500; cursor:pointer; border-bottom:2px solid transparent; transition:0.2s; white-space:nowrap; }
        .tab-btn:hover { color:var(--text-primary); background:rgba(255,255,255,0.03); }
        .tab-btn.active { color:var(--accent-gold); border-bottom-color:var(--accent-gold); background:rgba(212,168,83,0.06); }
        #main-panel { padding:28px 32px; }
        .tab-content { display:none; flex-direction:column; gap:28px; }
        .tab-content.active { display:flex; }
        .chart-container { background:var(--bg-panel); backdrop-filter:blur(12px); border:1px solid var(--border-subtle); border-radius:var(--radius-lg); padding:22px; }
        .snapshot-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; }
        .snapshot-card { background:rgba(0,0,0,0.2); border-radius:var(--radius); padding:14px; border:1px solid var(--border-subtle); }
        .card-label { font-size:10px; color:var(--text-muted); text-transform:uppercase; letter-spacing:1px; }
        .card-value { font-size:18px; font-weight:700; margin:6px 0; }
        .card-desc { font-size:11px; color:var(--text-secondary); }
        .btn { background:rgba(212,168,83,0.12); border:1px solid var(--border-subtle); color:var(--accent-gold); padding:8px 16px; border-radius:var(--radius-sm); cursor:pointer; font-size:12px; transition:0.2s; }
        .btn:hover { background:rgba(212,168,83,0.25); }
        .heatmap-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; margin-top:12px; }
        .heatmap-cell { aspect-ratio:1; border-radius:4px; cursor:pointer; min-height:24px; }
        .breadcrumb { font-size:12px; color:var(--text-secondary); margin-bottom:8px; }
        .breadcrumb span { cursor:pointer; color:var(--accent-gold); }
        .history-bookmark { background:rgba(212,168,83,0.08); border-radius:10px; padding:8px 12px; margin-bottom:8px; cursor:pointer; transition:all 0.2s; font-size:12px; display:flex; justify-content:space-between; }
        .history-bookmark:hover { background:rgba(212,168,83,0.2); }
    </style>
</head>
<body>
<div class="sb">
    <div class="sb-b"><h1>⟡ Deep Fusion</h1><p>宏观 · 中观 · 微观 · 政策 · 国际</p></div>
    <div style="padding:0 20px 20px;">
        <div style="font-size:10px;font-weight:600;letter-spacing:1.5px;color:var(--text-muted);margin-bottom:8px;">数据状态</div>
        <div class="history-bookmark" id="live-status">加载中...</div>
    </div>
    <div style="padding:0 20px;margin-bottom:8px;">
        <div style="font-size:10px;font-weight:600;letter-spacing:1.5px;color:var(--text-muted);margin-bottom:8px;">历史快照</div>
        <div class="history-bookmark" onclick="jumpToHistory('2012Q4')">📋 2012Q4 <span style="background:var(--accent-gold);color:#000;padding:1px 8px;border-radius:12px;">87%</span></div>
        <div class="history-bookmark" onclick="jumpToHistory('2019Q1')">📋 2019Q1 <span style="background:var(--accent-gold);color:#000;padding:1px 8px;border-radius:12px;">79%</span></div>
        <div class="history-bookmark" onclick="jumpToHistory('2015Q3')">📋 2015Q3 <span style="background:var(--accent-gold);color:#000;padding:1px 8px;border-radius:12px;">71%</span></div>
    </div>
</div>
<div class="mn">
    <div id="top-tabs">
        <button class="tab-btn active" data-tab="macro">🌐 宏观</button>
        <button class="tab-btn" data-tab="meso">🏭 中观</button>
        <button class="tab-btn" data-tab="micro">🔬 微观</button>
        <button class="tab-btn" data-tab="policy">📜 政策</button>
        <button class="tab-btn" data-tab="global">🌍 国际</button>
    </div>
    <main id="main-panel">
        <!-- 宏观 -->
        <div class="tab-content active" id="tab-macro">
            <div class="chart-container">
                <div style="display:flex; justify-content:space-between;"><span style="font-size:13px;color:var(--text-secondary);">📊 多周期嵌套合成图</span><span id="macro-chart-title" style="font-weight:600;">加载中...</span></div>
                <div id="macro-chart" style="height:300px;width:100%;"></div>
                <div style="display:flex; gap:20px; font-size:11px; margin-top:8px;">
                    <span><span style="display:inline-block; width:14px; height:3px; background:#d2991d;"></span> 康波</span>
                    <span><span style="display:inline-block; width:14px; height:3px; background:#a371f7;"></span> 库兹涅茨</span>
                    <span><span style="display:inline-block; width:14px; height:3px; background:#58a6ff;"></span> 朱格拉</span>
                    <span><span style="display:inline-block; width:14px; height:3px; background:#f85149;"></span> 基钦</span>
                </div>
            </div>
            <div class="snapshot-row" id="macro-snapshot"></div>
        </div>
        <!-- 中观 -->
        <div class="tab-content" id="tab-meso">
            <div class="breadcrumb" id="meso-breadcrumb"><span onclick="resetMesoDrill()">全行业景气</span></div>
            <div class="chart-container">
                <div style="font-size:13px;">🏭 行业行情 (ECharts)</div>
                <div id="meso-chart" style="height:280px;width:100%;"></div>
            </div>
            <div class="snapshot-row" id="meso-snapshot"></div>
        </div>
        <!-- 微观 -->
        <div class="tab-content" id="tab-micro">
            <div class="chart-container">
                <div style="font-size:13px;">📊 市场情绪</div>
                <div id="micro-chart" style="height:280px;width:100%;"></div>
            </div>
        </div>
        <!-- 政策 -->
        <div class="tab-content" id="tab-policy">
            <div class="chart-container">
                <div style="font-size:13px;">📜 政策追踪</div>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-top:12px;">
                    <div id="policy-pie" style="height:280px;"></div>
                    <div id="policy-list" style="max-height:300px;overflow-y:auto;"></div>
                </div>
            </div>
        </div>
        <!-- 国际 -->
        <div class="tab-content" id="tab-global">
            <div class="chart-container">
                <div style="font-size:13px;">🌍 国际数据</div>
                <div id="global-chart" style="height:280px;width:100%;"></div>
            </div>
        </div>
    </main>
</div>

<script>
const API = '/api/tools/call';

async function callMCP(name, args = {}) {
    const r = await fetch(API, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name, arguments:args}) });
    const j = await r.json();
    return j.data || '';
}

// ── 配色 ──
const MONET = ['#d2991d','#a371f7','#58a6ff','#f85149','#3fb950','#db6d28','#7b5ea7','#c49ba5'];

// ── Tab 切换 ──
document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
    });
});

// ── 宏观：周期图 ──
async function loadMacro() {
    const chart = echarts.init(document.getElementById('macro-chart'));
    const [kitchinJ, juglarJ, kuznetsJ] = await Promise.all([
        callMCP('data_kitchin'), callMCP('data_juglar'), callMCP('data_kuznets')
    ]);
    let series = [], xData = [];
    const snap = document.getElementById('macro-snapshot');
    snap.innerHTML = '';

    // 基钦：demand_yoy（连续值）+ 阶段卡
    try {
        const arr = JSON.parse(kitchinJ);
        if (arr && arr.length) {
            const d = arr.slice(-120);
            xData = d.map(r => (r.period||'').slice(0,7));
            series.push({ name:'基钦(需求)', type:'line', data:d.map(r => r.demand_yoy),
                smooth:true, symbol:'none', lineStyle:{color:MONET[3],width:2}, areaStyle:{color:MONET[3]+'15'} });
            const last = d[d.length-1];
            snap.innerHTML += `<div class="snapshot-card"><div class="card-label">基钦</div><div class="card-value" style="color:${MONET[3]}">${last.stage_name||'?'}</div><div class="card-desc">需求 ${last.demand_yoy}% · 库存 ${last.inventory_yoy}%</div></div>`;
        }
    } catch(e) {}

    // 朱格拉：comp_z（连续z值）+ 阶段卡
    try {
        const arr = JSON.parse(juglarJ);
        if (arr && arr.length) {
            const d = arr.slice(-120);
            if (!xData.length) xData = d.map(r => (r.period||'').slice(0,7));
            series.push({ name:'朱格拉(z值)', type:'line', data:d.map(r => r.comp_z),
                smooth:true, symbol:'none', lineStyle:{color:MONET[2],width:2}, areaStyle:{color:MONET[2]+'15'} });
            const last = d[d.length-1];
            snap.innerHTML += `<div class="snapshot-card"><div class="card-label">朱格拉</div><div class="card-value" style="color:${MONET[2]}">${last.phase_name||'?'}</div><div class="card-desc">投资z ${last.comp_z?.toFixed(2)||'?'}</div></div>`;
        }
    } catch(e) {}

    // 库兹涅茨：house_price_yoy（连续值）+ 阶段卡
    try {
        const arr = JSON.parse(kuznetsJ);
        if (arr && arr.length) {
            const d = arr.slice(-120);
            if (!xData.length) xData = d.map(r => (r.period||'').slice(0,7));
            series.push({ name:'库兹涅茨(房价)', type:'line', data:d.map(r => r.house_price_yoy),
                smooth:true, symbol:'none', lineStyle:{color:MONET[1],width:2}, areaStyle:{color:MONET[1]+'15'} });
            const last = d[d.length-1];
            snap.innerHTML += `<div class="snapshot-card"><div class="card-label">库兹涅茨</div><div class="card-value" style="color:${MONET[1]}">${last.phase_name||'?'}</div><div class="card-desc">房价 ${last.house_price_yoy?.toFixed(1)||'?'}%</div></div>`;
        }
    } catch(e) {}

    // 康波：PCA1 + 阶段卡
    try {
        const kvRaw = await callMCP('data_kondratiev', {method:'pca'});
        const kv = JSON.parse(kvRaw);
        if (kv && kv.pca1 && kv.years) {
            const step = Math.max(1, Math.floor(kv.pca1.length / 120));
            const kData = kv.pca1.filter((_,i) => i % step === 0);
            const kYears = kv.years.filter((_,i) => i % step === 0);
            if (!xData.length) xData = kYears;
            series.push({ name:'康波(PCA)', type:'line', data:kData, smooth:true, symbol:'none',
                lineStyle:{color:MONET[0], width:2.5}, areaStyle:{color:MONET[0]+'10'} });
        }
        const kvText = await callMCP('kondratiev_cycle');
        const m = kvText.match(/当前相位:\s*(\d+)\s*[—\-]\s*(\S+)/);
        if (m) {
            snap.innerHTML += `<div class="snapshot-card"><div class="card-label">康波</div><div class="card-value" style="color:${MONET[0]}">${m[2]}</div><div class="card-desc">相位 ${m[1]}</div></div>`;
        }
    } catch(e) {}

    chart.setOption({
        backgroundColor:'transparent', tooltip:{trigger:'axis', theme:'dark'},
        legend:{data:series.map(s=>s.name), textStyle:{color:'#B0A898'}, top:0},
        grid:{left:'6%', right:'5%', bottom:'12%', top:'18%'},
        xAxis:{type:'category', data:xData, axisLabel:{color:'#B0A898',rotate:30,fontSize:10}},
        yAxis:{type:'value', axisLabel:{color:'#B0A898',fontSize:10}, splitLine:{lineStyle:{color:'rgba(212,168,83,0.08)'}}},
        series,
    });
    document.getElementById('macro-chart-title').textContent = '基钦(需求) / 朱格拉(z值) / 库兹涅茨(房价) / 康波(PCA)';
}

// ── 中观 ──
async function loadMeso() {
    const chart = echarts.init(document.getElementById('meso-chart'));
    const raw = await callMCP('industry_daily_query', {industry:'银行', limit:120});
    const lines = raw.trim().split('\n');
    if (lines.length < 2) return;
    const dates = [], prices = [];
    lines.slice(1).reverse().forEach(l => {
        const parts = l.split(',');
        if (parts.length >= 3) { dates.push(parts[1].slice(5)); prices.push(parseFloat(parts[3])); }
    });
    chart.setOption({
        backgroundColor:'transparent', tooltip:{trigger:'axis', theme:'dark'},
        title:{text:'银行 收盘价', textStyle:{color:'#D4A853',fontSize:14}, left:'center'},
        grid:{left:'5%',right:'5%',bottom:'12%',top:'18%'},
        xAxis:{type:'category', data:dates, axisLabel:{color:'#B0A898',fontSize:10,rotate:30}},
        yAxis:{type:'value', axisLabel:{color:'#B0A898',fontSize:10}, splitLine:{lineStyle:{color:'rgba(212,168,83,0.08)'}}},
        series:[{type:'line', data:prices, smooth:true, symbol:'none', lineStyle:{color:MONET[4],width:2}, areaStyle:{color:MONET[4]+'15'}}],
    });
    // 行业快照
    const snap = document.getElementById('meso-snapshot');
    for (const ind of ['钢铁','房地产','白酒','煤炭','光伏设备']) {
        const r = await callMCP('industry_daily_query', {industry:ind, limit:1});
        const l = r.trim().split('\n');
        if (l.length >= 2) {
            const p = l[1].split(',');
            snap.innerHTML += `<div class="snapshot-card"><div class="card-label">${ind}</div><div class="card-value">${parseFloat(p[3]).toFixed(0)}</div><div class="card-desc">${p[1]}</div></div>`;
        }
    }
}

// ── 微观 ──
async function loadMicro() {
    const chart = echarts.init(document.getElementById('micro-chart'));
    const raw = await callMCP('fred_data', {series:'fred_gs10', limit:120});
    const lines = raw.trim().split('\n');
    if (lines.length < 2) return;
    const dates = [], vals = [];
    lines.slice(1).forEach(l => {
        const [d,v] = l.split(',');
        if (d && v) { dates.push(d.slice(0,7)); vals.push(parseFloat(v)); }
    });
    chart.setOption({
        backgroundColor:'transparent', tooltip:{trigger:'axis', theme:'dark'},
        title:{text:'10Y 国债收益率 (GS10)', textStyle:{color:'#D4A853',fontSize:14}, left:'center'},
        grid:{left:'5%',right:'5%',bottom:'12%',top:'18%'},
        xAxis:{type:'category', data:dates.slice(-60), axisLabel:{color:'#B0A898',fontSize:10,rotate:30}},
        yAxis:{type:'value', axisLabel:{color:'#B0A898',fontSize:10}, splitLine:{lineStyle:{color:'rgba(212,168,83,0.08)'}}},
        series:[{type:'line', data:vals.slice(-60), smooth:true, symbol:'none',
            lineStyle:{color:MONET[0],width:2}, areaStyle:{color:MONET[0]+'15'}}],
    });
}

// ── 政策 ──
async function loadPolicy() {
    const [stats, docs] = await Promise.all([callMCP('policy_stats'), callMCP('policy_search', {limit:20})]);
    // 饼图
    const pie = echarts.init(document.getElementById('policy-pie'));
    const pieData = [];
    stats.split('\n').forEach(l => {
        const m = l.match(/([^:]+):\s*(\d+)\s*篇/);
        if (m) pieData.push({name:m[1].trim(), value:parseInt(m[2])});
    });
    pie.setOption({
        backgroundColor:'transparent',
        tooltip:{trigger:'item'},
        title:{text:'发文分布', textStyle:{color:'#D4A853',fontSize:14}, left:'center'},
        series:[{type:'pie', radius:['30%','60%'], center:['50%','55%'], data:pieData,
            color:MONET, label:{color:'#B0A898',fontSize:11},
            emphasis:{itemStyle:{shadowBlur:10,shadowColor:'rgba(0,0,0,0.3)'}}}],
    });
    // 文件列表
    const list = document.getElementById('policy-list');
    docs.split('\n').slice(1,20).forEach(d => {
        if (d.trim()) list.innerHTML += `<div style="padding:6px 10px;margin:3px 0;border-radius:6px;background:rgba(0,0,0,0.15);font-size:11px;">${d.length>60?d.slice(0,60)+'...':d}</div>`;
    });
}

// ── 国际 ──
async function loadGlobal() {
    const chart = echarts.init(document.getElementById('global-chart'));
    const raw = await callMCP('wb_data', {indicator:'wb_gdp_growth', limit:60});
    const lines = raw.trim().split('\n');
    if (lines.length < 2) return;
    const years = [], vals = [];
    lines.slice(1).forEach(l => {
        const [y,v] = l.split(',');
        if (y && v) { years.push(y); vals.push(parseFloat(v)); }
    });
    chart.setOption({
        backgroundColor:'transparent', tooltip:{trigger:'axis', theme:'dark'},
        title:{text:'全球GDP增长率', textStyle:{color:'#D4A853',fontSize:14}, left:'center'},
        grid:{left:'5%',right:'5%',bottom:'12%',top:'18%'},
        xAxis:{type:'category', data:years, axisLabel:{color:'#B0A898',fontSize:10}},
        yAxis:{type:'value', axisLabel:{color:'#B0A898',fontSize:10}, splitLine:{lineStyle:{color:'rgba(212,168,83,0.08)'}}},
        series:[{type:'line', data:vals, smooth:true, symbol:'none',
            lineStyle:{color:MONET[2],width:2}, areaStyle:{color:MONET[2]+'15'}}],
    });
    // 快照：人口、贸易、用电量
    const snap = document.getElementById('policy-list').parentElement.parentElement;
    // 偷懒用 global-chart 下面的位置
}

// ── 初始化 ──
(async () => {
    // 侧边栏状态
    const st = await callMCP('policy_stats');
    const m = st.match(/(\d+)\s*篇/);
    document.getElementById('live-status').innerHTML = `📋 政策文件: ${m ? m[1] : '?'} 篇`;

    await Promise.all([loadMacro(), loadMeso(), loadMicro(), loadPolicy(), loadGlobal()]);
})();
</script>
</body>
</html>
